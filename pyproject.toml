[project]
name = "speedflags"
version = "1.0.0"
description = "A flag game with server-validated casual scoring"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "cryptography>=44", "python-dotenv>=1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "pip-audit>=2.9"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.scripts]
build = "npm ci && npm run build"

# Middleware only handles API validation/headers; static files can bypass it.
[tool.vercel.fastapi.static]
cdn = true
