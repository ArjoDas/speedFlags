name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
        env:
          UV_PROJECT_ENVIRONMENT: .venv-modernise
      - run: npm ci
      - run: python3 scripts/data.py --check
      - run: .venv-modernise/bin/python scripts/dev-key.py
      - run: npm run lint && npm run format:check && npm test && npm run build
      - run: .venv-modernise/bin/ruff check backend scripts && .venv-modernise/bin/ruff format --check backend scripts && .venv-modernise/bin/pytest -q
      - run: .venv-modernise/bin/python -m scripts.openapi && npm run api:types && git diff --exit-code -- data/openapi.json frontend/src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
